worker_processes auto;

events {
    worker_connections 1000;
    use epoll;
    multi_accept on;
}

http {
    upstream invision-api {
        server invision-api:8000;
        keepalive 64;
    }

    proxy_read_timeout 120s;
    limit_req_zone $binary_remote_addr zone=last_price_limit:10m rate=1r/s;

    # Bloque para redirigir HTTP a HTTPS
    server {
        listen 80;
        server_name api.biblioteca-invision.com;

        return 301 https://$host$request_uri;
    }

    # Bloque HTTPS con certificado
    server {
        listen 443 ssl;
        server_name api.biblioteca-invision.com;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /invision-api/ {
            rewrite ^/invision-api(/.*)$ $1 break;
            proxy_pass http://invision-api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
        }

        error_log /var/log/nginx/error.log;
    }
}
